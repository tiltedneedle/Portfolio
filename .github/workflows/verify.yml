# Every push and pull request runs the same verification loop that runs on
# the desktop: unit tests, the content validator, lint, a production build,
# the smoke suite against `next start` in both modes (open door, and
# accounts, against a stand-in for the Tilted Needle app's Supabase), every
# page reached by following links with its anchors and images (links),
# attempts on the door with forged, expired and wrongly signed sessions and
# accounts that have no portal here (door), and the accessibility pass in a real
# browser against the gated server: every room at desktop and phone width
# through axe (WCAG 2.2 AA), with no horizontal overflow and no console
# errors; then the same pages in Safari's engine (WebKit) as an iPhone and
# as desktop Safari, which counts what an animation draws toward a page's
# width where Chromium does not (safari).
name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Both actions at v7, which run on Node 24: at v4 they ran on Node 20,
      # which GitHub has deprecated and was already forcing up to 24.
      - uses: actions/checkout@v7

      # The Node version is package.json's engines field, the one Vercel
      # builds and runs with, so what is tested here is what goes out.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Content
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Browsers for the accessibility and Safari passes
        run: npx playwright install --with-deps chromium webkit

      - name: Smoke, open door
        run: |
          npx next start -p 3400 > open.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3400/ && break; sleep 1; done
          npm run smoke -- http://localhost:3400
          npm run links -- http://localhost:3400
          kill %1 || true

      - name: Smoke, gated
        env:
          # The Tilted Needle app's Supabase project, stood in for by the
          # test double (scripts/auth-double.mjs), whose accounts exist only
          # in that file. A production build refuses a localhost address.
          SUPABASE_URL: http://localhost:54321
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_double
        run: |
          node scripts/auth-double.mjs > double.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:54321/auth/v1/.well-known/jwks.json && break; sleep 1; done
          npx next start -p 3401 > gated.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3401/login && break; sleep 1; done
          npm run smoke -- http://localhost:3401 --gated
          npm run door -- http://localhost:3401
          npm run links -- http://localhost:3401 --gated
          npm run a11y -- http://localhost:3401 --sign-in
          DEBUG=pw:browser npm run safari -- http://localhost:3401 --sign-in
          kill %2 %1 || true

      - name: Server logs on failure
        if: failure()
        run: |
          echo "--- open"; cat open.log 2>/dev/null || true
          echo "--- gated"; cat gated.log 2>/dev/null || true
          echo "--- auth double"; cat double.log 2>/dev/null || true
